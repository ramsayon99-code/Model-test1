<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Traffic Sign Speed Detector</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0f14;
    color:white;
}

.app{
    max-width:650px;
    margin:auto;
    padding:18px;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.sub{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.card{
    background:#151b22;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
}

label{
    display:block;
    margin:12px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#1683ff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    opacity:.45;
}

#preview{
    display:none;
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:12px;
    margin-top:15px;
}

.status{
    padding:12px;
    border-radius:10px;
    background:#0d131a;
}

.result{
    line-height:1.8;
}

.safe{color:#00e676}
.danger{color:#ff5252}
.info{color:#40a9ff}
.muted{color:#999}

#canvas{
    width:100%;
    display:none;
    border-radius:12px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

<h1>🚦 Traffic Sign AI -h</h1>
<div class="sub">YOLOv8s • Browser AI</div>

<div class="card">

<div id="status" class="status">
⏳ Loading AI model...
</div>

<label>🚗 Your Speed (m/s)</label>

<input
    id="carSpeed"
    type="number"
    min="0"
    step="0.1"
    placeholder="Example: 5.56"
>

<div class="muted" style="margin-top:7px">
20 km/h = 5.56 m/s
</div>

<label>🖼️ Traffic Sign Image</label>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<img id="preview">

<canvas id="canvas"></canvas>

<button id="detectBtn" disabled>
🤖 Detect Sign
</button>

</div>

<div class="card">

<div id="result" class="result">
Waiting for image...
</div>

</div>

</div>

<script>

const MODEL_URL =
"https://huggingface.co/RZhukotynskyi/sign-detection-yolov8s/resolve/main/sdv4.onnx";

let session = null;

const statusEl =
document.getElementById("status");

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const detectBtn =
document.getElementById("detectBtn");

const resultEl =
document.getElementById("result");


// ==================================================
// LOAD MODEL
// ==================================================

async function loadModel(){

    try{

        statusEl.innerHTML =
        "⏳ Downloading AI model...";

        session =
        await ort.InferenceSession.create(
            MODEL_URL,
            {
                executionProviders:["wasm"],
                graphOptimizationLevel:"all"
            }
        );

        console.log(
            "INPUTS:",
            session.inputNames
        );

        console.log(
            "OUTPUTS:",
            session.outputNames
        );

        statusEl.innerHTML =
        "✅ AI Model Ready";

        detectBtn.disabled=false;

    }catch(error){

        console.error(error);

        statusEl.innerHTML =
        "❌ Model loading failed";

        resultEl.innerHTML = `
        <span class="danger">
        Model load failed.<br><br>
        ${error.message}
        </span>
        `;

    }

}


// ==================================================
// IMAGE PREVIEW
// ==================================================

imageInput.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file)return;

    preview.src =
    URL.createObjectURL(file);

    preview.style.display="block";

    resultEl.innerHTML =
    "Image ready. Press Detect.";

});


// ==================================================
// IMAGE → TENSOR
// ==================================================

function createTensor(img){

    const SIZE=640;

    const canvas =
    document.createElement("canvas");

    canvas.width=SIZE;
    canvas.height=SIZE;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        SIZE,
        SIZE
    );

    const pixels =
    ctx.getImageData(
        0,
        0,
        SIZE,
        SIZE
    ).data;

    const area =
    SIZE*SIZE;

    const data =
    new Float32Array(
        3*area
    );

    for(let i=0;i<area;i++){

        data[i] =
        pixels[i*4]/255;

        data[area+i] =
        pixels[i*4+1]/255;

        data[2*area+i] =
        pixels[i*4+2]/255;

    }

    return new ort.Tensor(
        "float32",
        data,
        [1,3,SIZE,SIZE]
    );

}


// ==================================================
// YOLO DETECTION
// ==================================================

async function detect(){

    if(!session){

        alert("AI model is still loading.");
        return;

    }

    const file =
    imageInput.files[0];

    if(!file){

        alert("Upload a traffic-sign image.");
        return;

    }

    const carSpeed =
    Number(
        document.getElementById(
            "carSpeed"
        ).value
    );

    if(
        !Number.isFinite(carSpeed) ||
        carSpeed<0
    ){

        alert(
            "Enter your speed in m/s."
        );

        return;

    }

    detectBtn.disabled=true;

    resultEl.innerHTML =
    "🔍 Detecting...";

    try{

        const img =
        new Image();

        img.src =
        URL.createObjectURL(file);

        await new Promise(
            resolve=>{
                img.onload=resolve;
            }
        );

        const tensor =
        createTensor(img);

        const inputName =
        session.inputNames[0];

        const outputs =
        await session.run({
            [inputName]:tensor
        });

        console.log(
            "RAW OUTPUT:",
            outputs
        );

        const output =
        outputs[
            session.outputNames[0]
        ];

        console.log(
            "OUTPUT SHAPE:",
            output.dims
        );

        const detections =
        decodeYOLO(
            output
        );

        if(
            detections.length===0
        ){

            resultEl.innerHTML = `
            <span class="danger">
            ⚠️ No traffic sign detected.
            </span>
            `;

            return;

        }

        detections.sort(
            (a,b)=>b.conf-a.conf
        );

        const best =
        detections[0];

        showResult(
            best,
            carSpeed
        );

    }catch(error){

        console.error(error);

        resultEl.innerHTML=`
        <span class="danger">
        ❌ Detection error
        </span>
        <br>
        ${error.message}
        `;

    }finally{

        detectBtn.disabled=false;

    }

}


// ==================================================
// YOLOv8 OUTPUT DECODER
// ==================================================

function decodeYOLO(output){

    const dims =
    output.dims;

    const data =
    output.data;

    if(dims.length!==3){

        console.log(
            "Unexpected dimensions:",
            dims
        );

        return [];

    }

    /*
       Typical YOLOv8 detection:

       [1,84,8400]

       or

       [1,8400,84]
    */

    let channels;
    let boxes;
    let transposed=false;

    if(dims[1]<dims[2]){

        channels=dims[1];
        boxes=dims[2];

    }else{

        boxes=dims[1];
        channels=dims[2];

        transposed=true;

    }

    const classes =
    channels-4;

    const detections=[];

    for(
        let i=0;
        i<boxes;
        i++
    ){

        let cx,cy,w,h;

        if(!transposed){

            cx=data[i];
            cy=data[boxes+i];
            w=data[boxes*2+i];
            h=data[boxes*3+i];

        }else{

            const o =
            i*channels;

            cx=data[o];
            cy=data[o+1];
            w=data[o+2];
            h=data[o+3];

        }

        let bestClass=-1;
        let bestScore=0;

        for(
            let c=0;
            c<classes;
            c++
        ){

            let score;

            if(!transposed){

                score =
                data[
                    (4+c)*boxes+i
                ];

            }else{

                score =
                data[
                    i*channels+4+c
                ];

            }

            if(score>bestScore){

                bestScore=score;
                bestClass=c;

            }

        }

        if(
            bestScore>=0.35
        ){

            detections.push({

                classId:bestClass,

                conf:bestScore,

                cx,
                cy,
                w,
                h

            });

        }

    }

    return detections;

}


// ==================================================
// RESULT
// ==================================================

function showResult(
    detection,
    carSpeed
){

    /*
       We deliberately DON'T guess
       the 100-class mapping.

       The model's public README does
       not provide those class names.
    */

    resultEl.innerHTML = `

    <span class="safe">
    ✅ Traffic sign detected
    </span>

    <br><br>

    🎯 Confidence:
    <b>
    ${(detection.conf*100).toFixed(1)}%
    </b>

    <br>

    🆔 Model Class ID:
    <b>
    ${detection.classId}
    </b>

    <br>

    🚗 Your speed:
    <b>
    ${carSpeed.toFixed(2)} m/s
    </b>

    <br><br>

    <span class="info">
    ℹ️ The model detected the sign, but its
    public model card does not provide the
    100 class-name mapping. Therefore the
    speed-limit number is not guessed.
    </span>

    `;

}


// ==================================================

detectBtn.addEventListener(
"click",
detect
);

loadModel();

</script>

</body>
</html>
