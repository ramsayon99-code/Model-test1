<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Speed Limit AI</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#1d1d1d;
    padding:20px;
    border-radius:18px;
}

input,button{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    box-sizing:border-box;
}

button{
    background:#2196f3;
    color:white;
    font-size:16px;
    font-weight:bold;
}

img{
    max-width:100%;
    margin-top:15px;
    border-radius:12px;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#292929;
}

.warning{
    background:#8b0000 !important;
}

.safe{
    background:#075c20 !important;
}
</style>
</head>

<body>

<div class="box">

<h1>🚗 Speed Limit AI -2</h1>

<p id="modelStatus">⏳ Loading AI model...</p>

<label>🚗 Car Speed (km/h)</label>

<input
    type="number"
    id="carSpeed"
    value="20"
    min="0"
    max="300"
>

<label>🖼️ Upload Speed Limit Sign</label>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<img id="preview" style="display:none;">

<button onclick="detectSign()">
    🤖 Detect Speed Limit
</button>

<div id="result">
    Waiting for image...
</div>

</div>

<script>

let session;

// IMPORTANT:
// Keep speed_limit_best.onnx in the same folder as this HTML.
const MODEL_PATH = "./speed_limit_best.onnx";

/*
Your 9 classes
*/
const CLASS_NAMES = [
    "STOP",
    "SPEED LIMIT 100",
    "SPEED LIMIT 120",
    "SPEED LIMIT 20",
    "SPEED LIMIT 30",
    "SPEED LIMIT 50",
    "SPEED-LIMIT-60",
    "SPEED LIMIT 70",
    "SPEED LIMIT 80"
];


/* ---------------- MODEL LOAD ---------------- */

async function loadModel(){

    try{

        session = await ort.InferenceSession.create(
            MODEL_PATH,
            {
                executionProviders:["wasm"]
            }
        );

        document.getElementById("modelStatus").innerHTML =
            "✅ Speed-limit AI loaded";

    }catch(error){

        document.getElementById("modelStatus").innerHTML =
            "❌ Model loading failed";

        console.error(error);
    }
}

loadModel();


/* ---------------- IMAGE PREVIEW ---------------- */

document.getElementById("imageInput").addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file) return;

        const img = document.getElementById("preview");

        img.src = URL.createObjectURL(file);
        img.style.display = "block";
    }
);


/* ---------------- IMAGE → TENSOR ---------------- */

function imageToTensor(img){

    const canvas = document.createElement("canvas");

    canvas.width = 640;
    canvas.height = 640;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(img,0,0,640,640);

    const imageData = ctx.getImageData(
        0,
        0,
        640,
        640
    );

    const data = new Float32Array(
        1 * 3 * 640 * 640
    );

    for(let i=0;i<640*640;i++){

        data[i] =
            imageData.data[i*4] / 255.0;

        data[640*640+i] =
            imageData.data[i*4+1] / 255.0;

        data[2*640*640+i] =
            imageData.data[i*4+2] / 255.0;
    }

    return new ort.Tensor(
        "float32",
        data,
        [1,3,640,640]
    );
}


/* ---------------- SPEED EXTRACTION ---------------- */

function getSpeed(className){

    const match = className.match(/\d+/);

    if(!match) return null;

    return Number(match[0]);
}


/* ---------------- DETECTION ---------------- */

async function detectSign(){

    const file =
        document.getElementById("imageInput").files[0];

    const carSpeed =
        Number(document.getElementById("carSpeed").value);

    const result =
        document.getElementById("result");

    if(!session){

        result.innerHTML =
            "❌ AI model is not loaded yet.";

        return;
    }

    if(!file){

        result.innerHTML =
            "⚠️ Pehle speed-limit sign ki image upload karo.";

        return;
    }


    result.className = "";

    result.innerHTML =
        "🤖 AI is detecting...";


    const img = new Image();

    img.onload = async function(){

        try{

            const inputTensor =
                imageToTensor(img);

            /*
            YOLO ONNX input name
            */

            const inputName =
                session.inputNames[0];

            const output =
                await session.run({

                    [inputName]:
                        inputTensor

                });

            const outputTensor =
                output[session.outputNames[0]];

            console.log(
                "RAW OUTPUT:",
                outputTensor
            );


            /*
            YOLO11 output normally:
            [1, 13, 8400]

            13 =
            4 box + 9 classes
            */

            const data =
                outputTensor.data;

            const dims =
                outputTensor.dims;

            let bestConfidence = 0;
            let bestClass = -1;


            /*
            Handle YOLO output
            */

            const numClasses =
                CLASS_NAMES.length;

            const numPredictions =
                dims[dims.length-1] === 8400
                ? dims[dims.length-1]
                : dims[dims.length-2];


            if(dims.length === 3){

                /*
                Expected:
                [1, 13, 8400]
                */

                const channels = dims[1];
                const predictions = dims[2];

                for(let i=0;i<predictions;i++){

                    for(
                        let c=0;
                        c<numClasses;
                        c++
                    ){

                        const confidence =
                            data[
                                (4+c)*predictions+i
                            ];

                        if(
                            confidence >
                            bestConfidence
                        ){

                            bestConfidence =
                                confidence;

                            bestClass = c;
                        }
                    }
                }
            }


            if(bestClass === -1){

                result.innerHTML =
                    "❌ No speed-limit sign detected.";

                return;
            }


            const className =
                CLASS_NAMES[bestClass];

            const signSpeed =
                getSpeed(className);


            if(signSpeed === null){

                result.innerHTML =
                    "⚠️ Detected: " +
                    className;

                return;
            }


            /*
            Compare speed
            */

            if(carSpeed > signSpeed){

                result.className =
                    "warning";

                result.innerHTML = `

                    <h2>🚨 OVER SPEED!</h2>

                    <p>🚦 Speed Limit Sign</p>

                    <h2>${signSpeed} km/h</h2>

                    <p>🚗 Your Car Speed</p>

                    <h2>${carSpeed} km/h</h2>

                    <hr>

                    <b>
                    ⚠️ You are ${carSpeed-signSpeed}
                    km/h over the limit.
                    </b>

                    <p>
                    🎯 AI Confidence:
                    ${(bestConfidence*100).toFixed(2)}%
                    </p>

                `;

            }else{

                result.className =
                    "safe";

                result.innerHTML = `

                    <h2>✅ SPEED OK</h2>

                    <p>🚦 Speed Limit Sign</p>

                    <h2>${signSpeed} km/h</h2>

                    <p>🚗 Your Car Speed</p>

                    <h2>${carSpeed} km/h</h2>

                    <hr>

                    <b>
                    👍 You are within the speed limit.
                    </b>

                    <p>
                    🎯 AI Confidence:
                    ${(bestConfidence*100).toFixed(2)}%
                    </p>

                `;
            }

        }catch(error){

            console.error(error);

            result.innerHTML = `
                ❌ Detection error
                <br><br>
                ${error.message}
            `;
        }

    };

    img.src =
        URL.createObjectURL(file);
}

</script>

</body>
</html>
