<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Speed Limit AI V2</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:#1c1c1c;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,button{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

input[type="number"]{
    background:#292929;
    color:white;
}

button{
    margin-top:15px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#555;
}

#preview{
    width:100%;
    max-height:400px;
    object-fit:contain;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

#cropCanvas{
    width:100%;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

.status{
    text-align:center;
    padding:10px;
    background:#292929;
    border-radius:10px;
}

.result{
    padding:20px;
    border-radius:15px;
    margin-top:15px;
    text-align:center;
    background:#292929;
}

.safe{
    background:#075c25;
}

.danger{
    background:#8b0000;
}

.big{
    font-size:30px;
    font-weight:bold;
}

.small{
    color:#bbb;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚗 Speed Limit AI V2</h1>

<div id="modelStatus" class="status">
⏳ Loading AI model...
</div>

<label>🚗 Your Car Speed (km/h)</label>

<input
    id="carSpeed"
    type="number"
    min="0"
    max="300"
    value="20"
>

<label>🖼️ Upload Speed Limit Sign Image</label>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<img id="preview">

<canvas id="cropCanvas"></canvas>

<button id="detectButton" onclick="startDetection()">
🤖 Detect Speed Limit
</button>

<div id="result" class="result">

Waiting for image...

</div>

</div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const MODEL_PATH = "./speed_limit_best.onnx";

const IMAGE_SIZE = 640;

/*
Your model has 9 classes.

IMPORTANT:
We are NOT using the number from these class names
as the final speed.

They are only used to identify speed-limit signs.
*/

const CLASS_NAMES = [
    "STOP",
    "SPEED LIMIT 100",
    "SPEED LIMIT 120",
    "SPEED LIMIT 20",
    "SPEED LIMIT 30",
    "SPEED LIMIT 50",
    "SPEED-LIMIT-60",
    "SPEED LIMIT 70",
    "SPEED LIMIT 80"
];

const SPEED_CLASS_IDS = [
    1,2,3,4,5,6,7,8
];

let session = null;


/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModel(){

    try{

        session = await ort.InferenceSession.create(
            MODEL_PATH,
            {
                executionProviders:["wasm"]
            }
        );

        document.getElementById(
            "modelStatus"
        ).innerHTML =
            "✅ AI Model Loaded";

        console.log("Input names:",session.inputNames);
        console.log("Output names:",session.outputNames);
        console.log("Input metadata:",session.inputMetadata);
        console.log("Output metadata:",session.outputMetadata);

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "modelStatus"
        ).innerHTML =
            "❌ Model loading failed";

    }

}

loadModel();


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document.getElementById(
    "imageInput"
).addEventListener("change",function(){

    const file=this.files[0];

    if(!file) return;

    const url=URL.createObjectURL(file);

    const img=document.getElementById("preview");

    img.src=url;

    img.style.display="block";

});


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file){

    return new Promise((resolve,reject)=>{

        const img=new Image();

        img.onload=()=>resolve(img);

        img.onerror=reject;

        img.src=URL.createObjectURL(file);

    });

}


/* =====================================================
   YOLO IMAGE PREPROCESSING
===================================================== */

function preprocessImage(img){

    const canvas=document.createElement("canvas");

    canvas.width=IMAGE_SIZE;
    canvas.height=IMAGE_SIZE;

    const ctx=canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        IMAGE_SIZE,
        IMAGE_SIZE
    );

    const imageData=ctx.getImageData(
        0,
        0,
        IMAGE_SIZE,
        IMAGE_SIZE
    );

    const area=IMAGE_SIZE*IMAGE_SIZE;

    const data=new Float32Array(
        3*area
    );

    for(let i=0;i<area;i++){

        const r=imageData.data[i*4];
        const g=imageData.data[i*4+1];
        const b=imageData.data[i*4+2];

        data[i]=r/255;
        data[area+i]=g/255;
        data[2*area+i]=b/255;

    }

    return new ort.Tensor(
        "float32",
        data,
        [1,3,IMAGE_SIZE,IMAGE_SIZE]
    );

}


/* =====================================================
   YOLO OUTPUT PARSER
===================================================== */

function parseYOLOOutput(output){

    const tensor=
        output[session.outputNames[0]];

    const data=tensor.data;
    const dims=tensor.dims;

    console.log("YOLO output dimensions:",dims);

    let candidates=[];

    /*
       YOLO11 commonly returns:

       [1, 4 + classes, predictions]

       For 9 classes:

       [1, 13, 8400]
    */

    if(
        dims.length===3 &&
        dims[1]===(4+CLASS_NAMES.length)
    ){

        const channels=dims[1];
        const predictions=dims[2];

        for(let i=0;i<predictions;i++){

            let bestClass=-1;
            let bestScore=0;

            for(let c=0;c<CLASS_NAMES.length;c++){

                const score=
                    data[(4+c)*predictions+i];

                if(score>bestScore){

                    bestScore=score;
                    bestClass=c;

                }

            }

            if(
                bestClass>=0 &&
                bestScore>=0.25
            ){

                const cx=data[i];
                const cy=data[predictions+i];
                const w=data[2*predictions+i];
                const h=data[3*predictions+i];

                candidates.push({

                    classId:bestClass,
                    score:bestScore,

                    cx:cx,
                    cy:cy,
                    w:w,
                    h:h

                });

            }

        }

    }

    /*
       Some exported models can return:

       [1, 8400, 13]
    */

    else if(
        dims.length===3 &&
        dims[2]===(4+CLASS_NAMES.length)
    ){

        const predictions=dims[1];

        for(let i=0;i<predictions;i++){

            let bestClass=-1;
            let bestScore=0;

            for(let c=0;c<CLASS_NAMES.length;c++){

                const score=
                    data[i*(4+CLASS_NAMES.length)+4+c];

                if(score>bestScore){

                    bestScore=score;
                    bestClass=c;

                }

            }

            if(
                bestClass>=0 &&
                bestScore>=0.25
            ){

                candidates.push({

                    classId:bestClass,
                    score:bestScore,

                    cx:data[i*13],
                    cy:data[i*13+1],
                    w:data[i*13+2],
                    h:data[i*13+3]

                });

            }

        }

    }

    return candidates;

}


/* =====================================================
   IOU
===================================================== */

function calculateIoU(a,b){

    const ax1=a.cx-a.w/2;
    const ay1=a.cy-a.h/2;
    const ax2=a.cx+a.w/2;
    const ay2=a.cy+a.h/2;

    const bx1=b.cx-b.w/2;
    const by1=b.cy-b.h/2;
    const bx2=b.cx+b.w/2;
    const by2=b.cy+b.h/2;

    const x1=Math.max(ax1,bx1);
    const y1=Math.max(ay1,by1);
    const x2=Math.min(ax2,bx2);
    const y2=Math.min(ay2,by2);

    const width=Math.max(0,x2-x1);
    const height=Math.max(0,y2-y1);

    const intersection=width*height;

    const areaA=a.w*a.h;
    const areaB=b.w*b.h;

    const union=
        areaA+areaB-intersection;

    if(union<=0) return 0;

    return intersection/union;

}


/* =====================================================
   SIMPLE NMS
===================================================== */

function NMS(boxes){

    boxes.sort(
        (a,b)=>b.score-a.score
    );

    const selected=[];

    while(boxes.length){

        const current=boxes.shift();

        selected.push(current);

        boxes=boxes.filter(
            box=>calculateIoU(
                current,
                box
            )<0.45
        );

    }

    return selected;

}


/* =====================================================
   CROP DETECTED SIGN
===================================================== */

function cropDetectedSign(
    img,
    detection
){

    const canvas=
        document.getElementById(
            "cropCanvas"
        );

    /*
       YOLO coordinates are based on 640x640.
       Convert them back to original image.
    */

    const scaleX=
        img.width/IMAGE_SIZE;

    const scaleY=
        img.height/IMAGE_SIZE;

    let x=
        (detection.cx-detection.w/2)
        *scaleX;

    let y=
        (detection.cy-detection.h/2)
        *scaleY;

    let w=
        detection.w*scaleX;

    let h=
        detection.h*scaleY;


    /*
       Add padding around sign.
    */

    const paddingX=w*0.20;
    const paddingY=h*0.20;

    x-=paddingX;
    y-=paddingY;

    w+=paddingX*2;
    h+=paddingY*2;


    /*
       Keep inside image.
    */

    x=Math.max(0,x);
    y=Math.max(0,y);

    w=Math.min(w,img.width-x);
    h=Math.min(h,img.height-y);


    /*
       Bigger OCR image.
    */

    const scale=3;

    canvas.width=Math.max(
        1,
        Math.round(w*scale)
    );

    canvas.height=Math.max(
        1,
        Math.round(h*scale)
    );

    const ctx=canvas.getContext("2d");

    ctx.drawImage(
        img,
        x,y,w,h,
        0,0,
        canvas.width,
        canvas.height
    );

    canvas.style.display="block";

    return canvas;

}


/* =====================================================
   OCR
===================================================== */

async function readSpeedWithOCR(canvas){

    document.getElementById(
        "result"
    ).innerHTML=
        "🔎 Reading number from sign...";


    /*
       OCR only needs digits.

       This makes OCR more focused.
    */

    const result=
        await Tesseract.recognize(
            canvas,
            "eng",
            {
                logger:m=>{

                    if(
                        m.status==="recognizing text"
                    ){

                        const percent=
                            Math.round(
                                m.progress*100
                            );

                        document.getElementById(
                            "result"
                        ).innerHTML=
                            `🔎 Reading sign... ${percent}%`;

                    }

                },

                tessedit_char_whitelist:
                    "0123456789"
            }
        );


    const text=
        result.data.text
        .replace(/\D/g," ")
        .trim();

    console.log(
        "OCR raw text:",
        result.data.text
    );

    console.log(
        "OCR numbers:",
        text
    );


    /*
       Extract all numbers.
    */

    const numbers=
        text.match(/\d+/g) || [];


    /*
       Speed limits usually aren't tiny
       random numbers.

       Keep 1-300.
    */

    const validNumbers=
        numbers
        .map(Number)
        .filter(
            n=>n>=1 && n<=300
        );


    if(validNumbers.length===0){

        return null;

    }


    /*
       If OCR sees multiple numbers,
       choose the largest reasonable speed.
    */

    validNumbers.sort(
        (a,b)=>b-a
    );

    return validNumbers[0];

}


/* =====================================================
   MAIN DETECTION
===================================================== */

async function startDetection(){

    const file=
        document.getElementById(
            "imageInput"
        ).files[0];

    const carSpeed=
        Number(
            document.getElementById(
                "carSpeed"
            ).value
        );

    const result=
        document.getElementById(
            "result"
        );

    const button=
        document.getElementById(
            "detectButton"
        );


    if(!session){

        result.innerHTML=
            "❌ AI model is not loaded.";

        return;

    }


    if(!file){

        result.innerHTML=
            "⚠️ Upload a sign image first.";

        return;

    }


    button.disabled=true;

    result.className="result";

    result.innerHTML=
        "🤖 Detecting speed-limit sign...";


    try{

        const img=
            await loadImage(file);


        /*
           YOLO
        */

        const tensor=
            preprocessImage(img);


        const inputName=
            session.inputNames[0];


        const output=
            await session.run({

                [inputName]:tensor

            });


        let detections=
            parseYOLOOutput(output);


        console.log(
            "All detections:",
            detections
        );


        /*
           Only speed-limit classes.
           STOP is removed.
        */

        detections=
            detections.filter(
                d=>
                    SPEED_CLASS_IDS.includes(
                        d.classId
                    )
            );


        if(detections.length===0){

            result.innerHTML=
                "❌ No speed-limit sign detected.";

            button.disabled=false;

            return;

        }


        /*
           NMS
        */

        detections=
            NMS(detections);


        /*
           Highest confidence speed sign.
        */

        detections.sort(
            (a,b)=>b.score-a.score
        );


        const bestDetection=
            detections[0];


        console.log(
            "Best sign:",
            bestDetection
        );


        /*
           Crop sign
        */

        const crop=
            cropDetectedSign(
                img,
                bestDetection
            );


        /*
           OCR
        */

        const detectedSpeed=
            await readSpeedWithOCR(
                crop
            );


        if(detectedSpeed===null){

            result.className=
                "result";

            result.innerHTML=`

                <h2>⚠️ Sign detected</h2>

                <p>
                🤖 AI found a speed-limit sign,
                but OCR could not read the number.
                </p>

                <p class="small">
                Try a clearer / closer image.
                </p>

            `;

            button.disabled=false;

            return;

        }


        /*
           COMPARE
        */

        const difference=
            carSpeed-detectedSpeed;


        const confidence=
            (bestDetection.score*100)
            .toFixed(2);


        if(carSpeed>detectedSpeed){

            result.className=
                "result danger";

            result.innerHTML=`

                <div>🚨</div>

                <h2>OVER SPEED</h2>

                <p>🚦 Detected Sign</p>

                <div class="big">
                    ${detectedSpeed} km/h
                </div>

                <p>🚗 Your Car Speed</p>

                <div class="big">
                    ${carSpeed} km/h
                </div>

                <hr>

                <p>
                    ⚠️ You are
                    <b>${difference} km/h</b>
                    over the limit.
                </p>

                <p class="small">
                    YOLO confidence:
                    ${confidence}%
                </p>

                <p class="small">
                    🔎 Speed read using OCR
                </p>

            `;

        }

        else{

            result.className=
                "result safe";

            result.innerHTML=`

                <div>✅</div>

                <h2>SPEED OK</h2>

                <p>🚦 Detected Sign</p>

                <div class="big">
                    ${detectedSpeed} km/h
                </div>

                <p>🚗 Your Car Speed</p>

                <div class="big">
                    ${carSpeed} km/h
                </div>

                <hr>

                <p>
                    👍 You are within
                    the speed limit.
                </p>

                <p class="small">
                    YOLO confidence:
                    ${confidence}%
                </p>

                <p class="small">
                    🔎 Speed read using OCR
                </p>

            `;

        }

    }
    catch(error){

        console.error(error);

        result.className="result";

        result.innerHTML=`

            ❌ Error

            <br><br>

            ${error.message}

        `;

    }


    button.disabled=false;

}


/* =====================================================
   DONE
===================================================== */

</script>

</body>
</html>
