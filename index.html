<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Speed Limit AI V4</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:18px;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:650px;
    margin:auto;
}

.card{
    background:#1d1d1d;
    padding:20px;
    border-radius:20px;
}

h1{
    text-align:center;
    margin-top:0;
}

.status{
    background:#292929;
    padding:12px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input[type="number"],
input[type="file"]{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    background:#292929;
    color:white;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    background:#555;
}

img{
    width:100%;
    max-height:420px;
    object-fit:contain;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

canvas{
    width:100%;
    margin-top:12px;
    border-radius:12px;
    display:none;
    background:white;
}

.result{
    margin-top:18px;
    padding:18px;
    border-radius:15px;
    background:#292929;
}

.safe{
    background:#075c25;
}

.danger{
    background:#8b0000;
}

.warning{
    background:#704d00;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.12);
}

.value{
    font-weight:bold;
}

.big{
    font-size:30px;
    font-weight:bold;
    text-align:center;
    margin:10px 0;
}

.small{
    color:#bbb;
    font-size:13px;
}

hr{
    border:0;
    border-top:1px solid rgba(255,255,255,.2);
    margin:15px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚗 Speed Limit AI V4</h1>

<div id="modelStatus" class="status">
⏳ Loading AI model...
</div>

<label>🚗 Your Car Speed (km/h)</label>

<input
    id="carSpeed"
    type="number"
    min="0"
    max="300"
    value="20"
>

<label>🖼️ Upload Speed Limit Sign</label>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<img id="preview">

<canvas id="signCanvas"></canvas>

<button
    id="detectButton"
    onclick="startDetection()"
>
🤖 Detect Speed Limit
</button>

<div id="result" class="result">
Waiting for image...
</div>

</div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const MODEL_PATH = "./speed_limit_best.onnx";

const SIZE = 640;

const CLASS_NAMES = [
    "STOP",
    "SPEED LIMIT 100",
    "SPEED LIMIT 120",
    "SPEED LIMIT 20",
    "SPEED LIMIT 30",
    "SPEED LIMIT 50",
    "SPEED-LIMIT-60",
    "SPEED LIMIT 70",
    "SPEED LIMIT 80"
];

const SPEED_CLASSES = [
    1,2,3,4,5,6,7,8
];

let session = null;


/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModel(){

    try{

        session =
            await ort.InferenceSession.create(
                MODEL_PATH,
                {
                    executionProviders:["wasm"]
                }
            );

        document.getElementById(
            "modelStatus"
        ).innerHTML =
            "✅ AI Model Loaded";

        console.log(
            "INPUT:",
            session.inputNames
        );

        console.log(
            "OUTPUT:",
            session.outputNames
        );

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "modelStatus"
        ).innerHTML =
            "❌ Model loading failed";

    }

}

loadModel();


/* =====================================================
   PREVIEW
===================================================== */

document.getElementById(
    "imageInput"
).addEventListener(
    "change",
    function(){

        const file=this.files[0];

        if(!file) return;

        const img=
            document.getElementById("preview");

        img.src=
            URL.createObjectURL(file);

        img.style.display="block";

    }
);


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file){

    return new Promise(
        (resolve,reject)=>{

            const img=new Image();

            img.onload=()=>{
                resolve(img);
            };

            img.onerror=reject;

            img.src=
                URL.createObjectURL(file);

        }
    );

}


/* =====================================================
   PREPROCESS
===================================================== */

function preprocess(img){

    const canvas=
        document.createElement("canvas");

    canvas.width=SIZE;
    canvas.height=SIZE;

    const ctx=
        canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        SIZE,
        SIZE
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            SIZE,
            SIZE
        ).data;

    const area=
        SIZE*SIZE;

    const data=
        new Float32Array(
            area*3
        );

    for(let i=0;i<area;i++){

        data[i]=
            pixels[i*4]/255;

        data[area+i]=
            pixels[i*4+1]/255;

        data[area*2+i]=
            pixels[i*4+2]/255;

    }

    return new ort.Tensor(
        "float32",
        data,
        [1,3,SIZE,SIZE]
    );

}


/* =====================================================
   PARSE YOLO
===================================================== */

function parseYOLO(tensor){

    const data=tensor.data;
    const dims=tensor.dims;

    console.log(
        "Output dimensions:",
        dims
    );

    const detections=[];

    /*
       YOLO11:
       [1,13,8400]
    */

    if(
        dims.length===3 &&
        dims[1]===13
    ){

        const predictions=dims[2];

        for(
            let i=0;
            i<predictions;
            i++
        ){

            let classId=-1;
            let confidence=0;

            for(
                let c=0;
                c<9;
                c++
            ){

                const score=
                    data[
                        (4+c)*predictions+i
                    ];

                if(score>confidence){

                    confidence=score;
                    classId=c;

                }

            }

            if(
                classId>=0 &&
                confidence>=0.20
            ){

                detections.push({

                    classId,
                    confidence,

                    cx:data[i],
                    cy:data[
                        predictions+i
                    ],

                    w:data[
                        predictions*2+i
                    ],

                    h:data[
                        predictions*3+i
                    ]

                });

            }

        }

    }

    /*
       Alternative:
       [1,8400,13]
    */

    else if(
        dims.length===3 &&
        dims[2]===13
    ){

        const predictions=dims[1];

        for(
            let i=0;
            i<predictions;
            i++
        ){

            let classId=-1;
            let confidence=0;

            for(
                let c=0;
                c<9;
                c++
            ){

                const score=
                    data[
                        i*13+4+c
                    ];

                if(score>confidence){

                    confidence=score;
                    classId=c;

                }

            }

            if(
                classId>=0 &&
                confidence>=0.20
            ){

                detections.push({

                    classId,
                    confidence,

                    cx:data[i*13],
                    cy:data[i*13+1],

                    w:data[i*13+2],
                    h:data[i*13+3]

                });

            }

        }

    }

    return detections;

}


/* =====================================================
   IOU
===================================================== */

function iou(a,b){

    const ax1=
        a.cx-a.w/2;

    const ay1=
        a.cy-a.h/2;

    const ax2=
        a.cx+a.w/2;

    const ay2=
        a.cy+a.h/2;


    const bx1=
        b.cx-b.w/2;

    const by1=
        b.cy-b.h/2;

    const bx2=
        b.cx+b.w/2;

    const by2=
        b.cy+b.h/2;


    const x1=
        Math.max(ax1,bx1);

    const y1=
        Math.max(ay1,by1);

    const x2=
        Math.min(ax2,bx2);

    const y2=
        Math.min(ay2,by2);


    const width=
        Math.max(0,x2-x1);

    const height=
        Math.max(0,y2-y1);

    const intersection=
        width*height;


    const areaA=
        a.w*a.h;

    const areaB=
        b.w*b.h;


    return intersection/
        (
            areaA+
            areaB-
            intersection
        );

}


/* =====================================================
   NMS
===================================================== */

function nms(boxes){

    boxes.sort(
        (a,b)=>
            b.confidence-
            a.confidence
    );

    const result=[];

    while(boxes.length){

        const best=
            boxes.shift();

        result.push(best);

        boxes=
            boxes.filter(
                box=>
                    iou(best,box)<0.40
            );

    }

    return result;

}


/* =====================================================
   CROP SIGN
===================================================== */

function cropSign(
    img,
    detection
){

    const canvas=
        document.getElementById(
            "signCanvas"
        );

    /*
       Detection coordinates are from
       640x640 resized image.
    */

    let x=
        (
            detection.cx-
            detection.w/2
        ) / SIZE * img.width;

    let y=
        (
            detection.cy-
            detection.h/2
        ) / SIZE * img.height;

    let w=
        detection.w/
        SIZE*
        img.width;

    let h=
        detection.h/
        SIZE*
        img.height;


    /*
       Large padding helps OCR.
    */

    const px=w*0.35;
    const py=h*0.35;

    x-=px;
    y-=py;

    w+=px*2;
    h+=py*2;


    x=Math.max(0,x);
    y=Math.max(0,y);

    w=Math.min(
        w,
        img.width-x
    );

    h=Math.min(
        h,
        img.height-y
    );


    /*
       At least 4x enlargement.
    */

    const scale=4;

    canvas.width=
        Math.max(
            200,
            Math.round(w*scale)
        );

    canvas.height=
        Math.max(
            200,
            Math.round(h*scale)
        );


    const ctx=
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled=true;

    ctx.imageSmoothingQuality=
        "high";


    ctx.drawImage(
        img,
        x,y,w,h,
        0,0,
        canvas.width,
        canvas.height
    );


    canvas.style.display="block";

    return canvas;

}


/* =====================================================
   CREATE OCR VERSION
===================================================== */

function makeOCRCanvas(
    source,
    type
){

    const canvas=
        document.createElement("canvas");

    canvas.width=source.width;
    canvas.height=source.height;

    const ctx=
        canvas.getContext("2d");

    ctx.drawImage(
        source,
        0,
        0
    );

    const image=
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const p=image.data;


    for(
        let i=0;
        i<p.length;
        i+=4
    ){

        const r=p[i];
        const g=p[i+1];
        const b=p[i+2];


        /*
           Grayscale
        */

        let gray=
            0.299*r+
            0.587*g+
            0.114*b;


        if(type==="gray"){

            p[i]=gray;
            p[i+1]=gray;
            p[i+2]=gray;

        }


        /*
           Strong threshold
        */

        else if(
            type==="threshold"
        ){

            const value=
                gray>145
                ?255
                :0;

            p[i]=value;
            p[i+1]=value;
            p[i+2]=value;

        }


        /*
           Inverted threshold
        */

        else if(
            type==="invert"
        ){

            const value=
                gray>145
                ?0
                :255;

            p[i]=value;
            p[i+1]=value;
            p[i+2]=value;

        }

    }


    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas;

}


/* =====================================================
   OCR ONE VERSION
===================================================== */

async function OCRVersion(
    canvas,
    psm
){

    try{

        const result=
            await Tesseract.recognize(
                canvas,
                "eng",
                {

                    tessedit_char_whitelist:
                        "0123456789",

                    tessedit_pageseg_mode:
                        String(psm)

                }
            );


        const raw=
            result.data.text || "";


        console.log(
            "OCR:",
            raw
        );


        /*
           Find numbers.
        */

        const numbers=
            raw.match(/\d+/g) || [];


        return numbers
            .map(Number)
            .filter(
                n=>
                    n>=1 &&
                    n<=300
            );

    }
    catch(error){

        console.error(
            "OCR error:",
            error
        );

        return [];

    }

}


/* =====================================================
   OCR MULTIPLE METHODS
===================================================== */

async function readSpeed(
    signCanvas
){

    const result=
        document.getElementById(
            "result"
        );


    const versions=[
        {
            name:"Original",
            canvas:signCanvas
        },
        {
            name:"Grayscale",
            canvas:
                makeOCRCanvas(
                    signCanvas,
                    "gray"
                )
        },
        {
            name:"Threshold",
            canvas:
                makeOCRCanvas(
                    signCanvas,
                    "threshold"
                )
        },
        {
            name:"Inverted",
            canvas:
                makeOCRCanvas(
                    signCanvas,
                    "invert"
                )
        }
    ];


    const found=[];


    for(
        let i=0;
        i<versions.length;
        i++
    ){

        result.innerHTML=
            `🔎 OCR reading... ${
                i+1
            }/${versions.length}<br><br>${
                versions[i].name
            }`;


        /*
           PSM 7 = single line
           PSM 8 = single word
           PSM 10 = single character
        */

        for(
            const psm of [7,8,10]
        ){

            const numbers=
                await OCRVersion(
                    versions[i].canvas,
                    psm
                );


            for(
                const number of numbers
            ){

                found.push({

                    number:number,

                    method:
                        versions[i].name,

                    psm:psm

                });

            }

        }

    }


    console.log(
        "ALL OCR RESULTS:",
        found
    );


    if(found.length===0){

        return null;

    }


    /*
       Count how many times each
       number was detected.
    */

    const counts={};

    for(
        const item of found
    ){

        counts[item.number]=
            (counts[item.number]||0)+1;

    }


    /*
       Highest frequency first.
       Confidence count breaks ties.
    */

    const sorted=
        Object.entries(counts)
        .sort(
            (a,b)=>
                b[1]-a[1]
        );


    const bestNumber=
        Number(sorted[0][0]);


    console.log(
        "OCR FINAL:",
        bestNumber,
        counts
    );


    return {

        speed:bestNumber,

        counts:counts,

        rawResults:found

    };

}


/* =====================================================
   MAIN
===================================================== */

async function startDetection(){

    const file=
        document.getElementById(
            "imageInput"
        ).files[0];


    const carSpeed=
        Number(
            document.getElementById(
                "carSpeed"
            ).value
        );


    const result=
        document.getElementById(
            "result"
        );


    const button=
        document.getElementById(
            "detectButton"
        );


    if(!session){

        result.innerHTML=
            "❌ AI model is not loaded.";

        return;

    }


    if(!file){

        result.innerHTML=
            "⚠️ Upload a speed-limit sign image.";

        return;

    }


    button.disabled=true;

    result.className="result";

    result.innerHTML=
        "🤖 AI detecting sign...";


    try{

        const img=
            await loadImage(file);


        /*
           YOLO
        */

        const input=
            preprocess(img);


        const output=
            await session.run({

                [session.inputNames[0]]:
                    input

            });


        let detections=
            parseYOLO(
                output[
                    session.outputNames[0]
                ]
            );


        console.log(
            "Raw detections:",
            detections
        );


        /*
           Only speed-limit classes.
        */

        detections=
            detections.filter(
                d=>
                    SPEED_CLASSES.includes(
                        d.classId
                    )
            );


        if(detections.length===0){

            result.innerHTML=
                "❌ No speed-limit sign detected.";

            button.disabled=false;

            return;

        }


        /*
           NMS
        */

        detections=
            nms(detections);


        /*
           Highest confidence
        */

        detections.sort(
            (a,b)=>
                b.confidence-
                a.confidence
        );


        const best=
            detections[0];


        const modelClass=
            CLASS_NAMES[
                best.classId
            ];


        const modelSpeed=
            extractNumber(
                modelClass
            );


        const modelConfidence=
            (
                best.confidence*100
            ).toFixed(2);


        console.log(
            "MODEL CLASS:",
            modelClass
        );


        /*
           Crop sign
        */

        const signCanvas=
            cropSign(
                img,
                best
            );


        /*
           OCR
        */

        const OCR=
            await readSpeed(
                signCanvas
            );


        /*
           OCR failed
        */

        if(!OCR){

            result.className=
                "result warning";

            result.innerHTML=`

                <h2>⚠️ OCR Failed</h2>

                <div class="row">
                    <span>🤖 Model Prediction</span>
                    <span class="value">
                        ${modelClass}
                    </span>
                </div>

                <div class="row">
                    <span>🎯 Model Confidence</span>
                    <span class="value">
                        ${modelConfidence}%
                    </span>
                </div>

                <p>
                🔎 OCR number could not be read.
                </p>

                <p class="small">
                Try a closer, sharper image
                where the complete sign is visible.
                </p>

            `;

            button.disabled=false;

            return;

        }


        const OCRSpeed=
            OCR.speed;


        /*
           FINAL SPEED = OCR
        */

        const difference=
            carSpeed-OCRSpeed;


        /*
           Compare
        */

        if(carSpeed>OCRSpeed){

            result.className=
                "result danger";

            result.innerHTML=`

                <h2>🚨 OVER SPEED</h2>

                <div class="row">
                    <span>🤖 Model Prediction</span>
                    <span class="value">
                        ${modelClass}
                    </span>
                </div>

                <div class="row">
                    <span>🎯 Model Confidence</span>
                    <span class="value">
                        ${modelConfidence}%
                    </span>
                </div>

                <div class="row">
                    <span>🔎 OCR Reading</span>
                    <span class="value">
                        ${OCRSpeed} km/h
                    </span>
                </div>

                <hr>

                <div>
                    🚗 Your Car Speed
                </div>

                <div class="big">
                    ${carSpeed} km/h
                </div>

                <div>
                    🚦 Final Speed Limit
                </div>

                <div class="big">
                    ${OCRSpeed} km/h
                </div>

                <hr>

                <h3>
                    ⚠️ ${difference} km/h
                    over the limit
                </h3>

                <p class="small">
                    Final comparison is based
                    on OCR reading.
                </p>

            `;

        }

        else{

            result.className=
                "result safe";

            result.innerHTML=`

                <h2>✅ SPEED OK</h2>

                <div class="row">
                    <span>🤖 Model Prediction</span>
                    <span class="value">
                        ${modelClass}
                    </span>
                </div>

                <div class="row">
                    <span>🎯 Model Confidence</span>
                    <span class="value">
                        ${modelConfidence}%
                    </span>
                </div>

                <div class="row">
                    <span>🔎 OCR Reading</span>
                    <span class="value">
                        ${OCRSpeed} km/h
                    </span>
                </div>

                <hr>

                <div>
                    🚗 Your Car Speed
                </div>

                <div class="big">
                    ${carSpeed} km/h
                </div>

                <div>
                    🚦 Final Speed Limit
                </div>

                <div class="big">
                    ${OCRSpeed} km/h
                </div>

                <hr>

                <h3>
                    👍 Within speed limit
                </h3>

                <p class="small">
                    Final comparison is based
                    on OCR reading.
                </p>

            `;

        }


    }
    catch(error){

        console.error(error);

        result.className=
            "result warning";

        result.innerHTML=`

            ❌ Detection Error

            <br><br>

            ${error.message}

        `;

    }


    button.disabled=false;

}


/* =====================================================
   EXTRACT NUMBER FROM MODEL CLASS
===================================================== */

function extractNumber(text){

    const match=
        text.match(/\d+/);

    if(!match){

        return null;

    }

    return Number(match[0]);

}

</script>

</body>
</html>
