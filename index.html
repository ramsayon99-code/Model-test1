<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Limit AI Test</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #preview {
      width: min(95vw, 640px);
      max-height: 70vh;
      object-fit: contain;
      border: 2px solid #555;
      border-radius: 12px;
      margin-top: 15px;
    }

    button {
      margin: 10px 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      margin: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>🚗 Speed Limit AI Test</h1>

  <div id="status">Loading model...</div>

  <input type="file" id="imageInput" accept="image/*">

  <br>

  <img id="preview" hidden>

  <div id="result">Upload an image</div>

<script>

let session = null;

const MODEL_PATH = "./speed_limit_best.onnx";

const CLASS_NAMES = [
  "STOP",
  "SPEED LIMIT 100",
  "SPEED LIMIT 120",
  "SPEED LIMIT 20",
  "SPEED LIMIT 30",
  "SPEED LIMIT 50",
  "SPEED LIMIT 70",
  "SPEED-LIMIT-60",
  "SPEED-LIMIT-80"
];

const INPUT_SIZE = 640;

async function loadModel() {

  try {

    session = await ort.InferenceSession.create(
      MODEL_PATH,
      {
        executionProviders: ["wasm"]
      }
    );

    console.log("Model loaded");

    console.log("Input:", session.inputNames);
    console.log("Output:", session.outputNames);

    document.getElementById("status").innerText =
      "✅ Speed-limit model loaded";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Model loading failed";

  }

}

function imageToTensor(img) {

  const canvas = document.createElement("canvas");

  canvas.width = INPUT_SIZE;
  canvas.height = INPUT_SIZE;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0,
    INPUT_SIZE,
    INPUT_SIZE
  );

  const imageData = ctx.getImageData(
    0,
    0,
    INPUT_SIZE,
    INPUT_SIZE
  );

  const data = new Float32Array(
    3 * INPUT_SIZE * INPUT_SIZE
  );

  const area = INPUT_SIZE * INPUT_SIZE;

  for (let i = 0; i < area; i++) {

    const r = imageData.data[i * 4] / 255;
    const g = imageData.data[i * 4 + 1] / 255;
    const b = imageData.data[i * 4 + 2] / 255;

    data[i] = r;
    data[area + i] = g;
    data[area * 2 + i] = b;

  }

  return new ort.Tensor(
    "float32",
    data,
    [1, 3, INPUT_SIZE, INPUT_SIZE]
  );

}

async function detect(img) {

  if (!session) {

    document.getElementById("result").innerText =
      "❌ Model not loaded";

    return;

  }

  document.getElementById("result").innerText =
    "🔎 Detecting...";

  try {

    const tensor = imageToTensor(img);

    const inputName = session.inputNames[0];

    const output = await session.run({
      [inputName]: tensor
    });

    const outputName = session.outputNames[0];

    const result = output[outputName];

    console.log("Output shape:", result.dims);

    const detections = decodeOutput(result);

    showResults(detections);

  } catch (error) {

    console.error(error);

    document.getElementById("result").innerText =
      "❌ Detection error";

  }

}

function decodeOutput(output) {

  const data = output.data;
  const dims = output.dims;

  console.log("Raw output:", dims);

  /*
    YOLOv11 normally gives:

    [1, 4 + classes, 8400]

    For 9 classes:

    [1, 13, 8400]
  */

  let channels;
  let boxes;

  if (dims.length !== 3) {
    console.error("Unexpected output shape");
    return [];
  }

  if (dims[1] < dims[2]) {

    channels = dims[1];
    boxes = dims[2];

  } else {

    boxes = dims[1];
    channels = dims[2];

  }

  const classCount = channels - 4;

  console.log(
    "Channels:",
    channels,
    "Boxes:",
    boxes,
    "Classes:",
    classCount
  );

  const detections = [];

  for (let i = 0; i < boxes; i++) {

    let bestClass = -1;
    let bestScore = 0;

    for (let c = 0; c < classCount; c++) {

      let index;

      if (dims[1] === channels) {

        index = (4 + c) * boxes + i;

      } else {

        index = i * channels + 4 + c;

      }

      const score = data[index];

      if (score > bestScore) {

        bestScore = score;
        bestClass = c;

      }

    }

    if (bestScore >= 0.35) {

      detections.push({
        classId: bestClass,
        confidence: bestScore
      });

    }

  }

  return detections;

}

function showResults(detections) {

  const result = document.getElementById("result");

  if (detections.length === 0) {

    result.innerHTML =
      "❌ No speed-limit sign detected";

    return;

  }

  detections.sort(
    (a, b) => b.confidence - a.confidence
  );

  let html = "🚦 <b>Detected:</b><br><br>";

  detections.slice(0, 10).forEach((det, index) => {

    const name =
      CLASS_NAMES[det.classId] ||
      "Unknown class " + det.classId;

    const confidence =
      (det.confidence * 100).toFixed(2);

    html +=
      `${index + 1}. ${name} → ${confidence}%<br>`;

  });

  result.innerHTML = html;

}

document
  .getElementById("imageInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const img = document.getElementById("preview");

    img.src = URL.createObjectURL(file);

    img.hidden = false;

    img.onload = () => {

      detect(img);

    };

  });

loadModel();

</script>

</body>
</html>
